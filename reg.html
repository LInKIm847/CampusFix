        <form id="registerForm" method="post" action="/Identity/Account/Register">
            <h2>Create a new account.</h2>
            <hr />
            

            <div class="form-floating mb-3">
                <input class="form-control" autocomplete="name" aria-required="true" placeholder="Full name" type="text" data-val="true" data-val-length="The field Full name must be a string with a maximum length of 100." data-val-length-max="100" data-val-required="The Full name field is required." id="Input_FullName" maxlength="100" name="Input.FullName" value="" />

                <span class="text-danger field-validation-valid" data-valmsg-for="Input.FullName" data-valmsg-replace="true"></span>
            </div>

            <div class="form-floating mb-3">
                <input class="form-control" autocomplete="username" aria-required="true" placeholder="name@example.com" type="email" data-val="true" data-val-email="The Email field is not a valid e-mail address." data-val-required="The Email field is required." id="Input_Email" name="Input.Email" value="" />
                <label for="Input_Email">Email</label>
                <span class="text-danger field-validation-valid" data-valmsg-for="Input.Email" data-valmsg-replace="true"></span>
            </div>

            <div class="form-floating mb-3">
                <input class="form-control" autocomplete="new-password" aria-required="true" placeholder="Password" type="password" data-val="true" data-val-length="The Password must be at least 6 and at max 100 characters long." data-val-length-max="100" data-val-length-min="6" data-val-required="The Password field is required." id="Input_Password" maxlength="100" name="Input.Password" />
                <label for="Input_Password">Password</label>
                <span class="text-danger field-validation-valid" data-valmsg-for="Input.Password" data-valmsg-replace="true"></span>
            </div>

            <div class="form-floating mb-3">
                <input class="form-control" autocomplete="new-password" aria-required="true" placeholder="Confirm password" type="password" data-val="true" data-val-equalto="The password and confirmation password do not match." data-val-equalto-other="*.Password" data-val-required="The Confirm password field is required." id="Input_ConfirmPassword" name="Input.ConfirmPassword" />
                <label for="Input_ConfirmPassword">Confirm Password</label>
                <span class="text-danger field-validation-valid" data-valmsg-for="Input.ConfirmPassword" data-valmsg-replace="true"></span>
            </div>

            <button id="registerSubmit" type="submit" class="w-100 btn btn-lg btn-primary">Register</button>
